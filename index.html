<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MGG Pharmacy – Our Shops</title><meta name="theme-color" content="#070b17">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--blue:#4f8cff;--cyan:#5ce1ff;--ink:#f4f7ff;--muted:#9fb0d0;--bg:#070b17;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0}
body{font-family:'Oswald','Segoe UI',Arial,sans-serif;color:var(--ink);font-weight:400;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#16264d 0%,var(--bg) 60%) fixed;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0)}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;pointer-events:none}
.o1{width:320px;height:320px;background:#2f6bff;top:-80px;left:-100px;animation:drift 14s ease-in-out infinite alternate}
.o2{width:280px;height:280px;background:#19c6ff;bottom:8%;right:-120px;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,60px)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 16px 40px;text-align:center}
.logo{width:104px;height:104px;border-radius:50%;background:linear-gradient(145deg,#fff,#dfe9ff);display:grid;place-items:center;margin:0 auto;overflow:hidden;font-size:30px;font-weight:500;color:#16264d;box-shadow:0 0 0 3px rgba(92,225,255,.55),0 0 34px 6px rgba(79,140,255,.65),inset 0 -8px 16px rgba(79,140,255,.25)}
.logo img{width:100%;height:100%;object-fit:contain;padding:8px}
h1{font-size:25px;font-weight:500;margin:26px 0 6px;letter-spacing:.3px;text-shadow:0 0 22px rgba(92,225,255,.55)}
.tag{color:var(--muted);font-size:15px;font-weight:300}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.glass,.card{position:relative;background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 55%);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 28px rgba(79,140,255,.12),inset 0 1px 0 rgba(255,255,255,.35)}
.quick{display:flex;justify-content:center;gap:14px;margin:26px 0 20px}
.quick a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--ink);text-decoration:none;transition:box-shadow .2s,transform .2s}
.quick a:hover{box-shadow:0 0 26px rgba(92,225,255,.7);transform:translateY(-2px)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));color:var(--ink);font:inherit;font-size:17px;cursor:pointer;text-decoration:none;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 20px rgba(0,0,0,.35);transition:box-shadow .2s,transform .2s}
.btn::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 26px rgba(92,225,255,.45)}
.btn.primary{background:linear-gradient(180deg,#6aa2ff,#2a56d6);border-color:rgba(160,200,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 28px rgba(79,140,255,.65)}
.card{border-radius:16px;padding:6px 16px;text-align:left;margin:18px 0}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row:last-child{border-bottom:0}
.ico{flex:none;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),rgba(79,140,255,.25));display:grid;place-items:center;color:var(--cyan);box-shadow:0 0 14px rgba(79,140,255,.45)}
.ico svg{width:16px;height:16px}
.lbl{font-size:12px;color:var(--cyan);font-weight:300;letter-spacing:.3px}
.val{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
h2{font-size:18px;font-weight:400;text-align:left;margin:28px 0 12px;text-shadow:0 0 16px rgba(92,225,255,.45)}
.map{border-radius:16px;overflow:hidden;border:1px solid rgba(160,200,255,.35);box-shadow:0 0 30px rgba(79,140,255,.35),0 10px 40px rgba(0,0,0,.45);background:#0d1630}
.map iframe{display:block;width:100%;height:300px;border:0}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.gallery button{flex:none;width:78%;max-width:300px;aspect-ratio:4/3;border:1px solid rgba(160,200,255,.35);padding:0;border-radius:14px;overflow:hidden;scroll-snap-align:start;background:#0d1630;cursor:zoom-in;box-shadow:0 0 20px rgba(79,140,255,.3)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.link{display:flex;align-items:center;gap:16px;border-radius:12px;padding:12px 12px;margin-bottom:12px;color:inherit;text-decoration:none;font-size:18px;transition:box-shadow .2s}
.link:hover{box-shadow:0 0 26px rgba(92,225,255,.5)}
.link svg.brand{width:36px;height:36px;flex:none;stroke:none}
.link .go{margin-left:auto;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(3,6,14,.92);display:none;place-items:center;z-index:10;padding:16px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 0 40px rgba(79,140,255,.5)}
footer{margin-top:30px;font-size:12px;color:var(--muted);font-weight:300}
a:focus-visible,button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{transition:none!important}}
h1{font-size:28px}.link{justify-content:space-between;text-align:left}
</style></head><body><div class="orb o1"></div><div class="orb o2"></div>
<main><div class="logo" id="logo">MGG</div><h1>MGG Pharmacy</h1><p class="tag">Choose your nearest shop</p><div id="list" style="margin-top:28px"></div></main>
<script src="shops.js"></script>
<script>
const arrow='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("list").innerHTML=Object.entries(SHOPS).map(([k,s])=>`<a class="link glass" href="shop.html?s=${encodeURIComponent(k)}">${esc(s.name)}<span class="go">${arrow}</span></a>`).join("");
const i=new Image();i.alt="MGG logo";i.onload=()=>{const l=document.getElementById("logo");l.textContent="";l.appendChild(i)};i.src=COMMON.logo;
</script></body></html>
